<main class="auth">
  <div class="card">
    <h1>Recuperar contraseña</h1>
    <p class="sub">Te enviaremos un enlace para restablecer tu contraseña.</p>

    @if (sentMessage(); as msg) {
      <p class="ok">{{ msg }}</p>
      <p class="switch">Revisa tu correo (y la carpeta de spam). <a routerLink="/login">Volver a iniciar sesión</a></p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label class="field">
          <span>Correo</span>
          <input type="email" formControlName="email" autocomplete="email" />
        </label>

        @if (error()) {
          <p class="err">{{ error() }}</p>
        }

        <button type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Enviando…' : 'Enviar enlace' }}
        </button>
      </form>

      <p class="switch">
        ¿Ya la recordaste? <a routerLink="/login">Inicia sesión</a>
      </p>
    }
  </div>
</main>
