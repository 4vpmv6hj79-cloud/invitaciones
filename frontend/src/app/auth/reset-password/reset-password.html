<main class="auth">
  <div class="card">
    <h1>Restablecer contraseña</h1>

    @if (missingToken()) {
      <p class="err">El enlace no es válido. Solicita uno nuevo desde "¿Olvidaste tu contraseña?".</p>
      <p class="switch"><a routerLink="/recuperar">Pedir un nuevo enlace</a></p>
    } @else if (done()) {
      <p class="ok">Tu contraseña se actualizó correctamente.</p>
      <button type="button" (click)="goToLogin()">Iniciar sesión</button>
    } @else {
      <p class="sub">Escribe tu nueva contraseña.</p>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label class="field">
          <span>Nueva contraseña</span>
          <input type="password" formControlName="password" autocomplete="new-password" />
          <small>Mínimo 8 caracteres.</small>
        </label>
        <label class="field">
          <span>Confirmar contraseña</span>
          <input type="password" formControlName="confirm" autocomplete="new-password" />
        </label>

        @if (error()) {
          <p class="err">{{ error() }}</p>
        }

        <button type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Guardando…' : 'Guardar contraseña' }}
        </button>
      </form>
    }
  </div>
</main>
